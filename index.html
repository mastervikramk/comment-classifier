<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum Moderation Dashboard | Cloudflare Clef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #ffffff;
      --bg-surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --border-color: #e2e8f0;
      --border-focus: #3b82f6;

      --accent-acceptable: #10b981;
      --accent-acceptable-bg: #ecfdf5;
      --accent-acceptable-border: #a7f3d0;
      --accent-acceptable-text: #065f46;

      --accent-toxic: #ef4444;
      --accent-toxic-bg: #fef2f2;
      --accent-toxic-border: #fecaca;
      --accent-toxic-text: #991b1b;

      --accent-spam: #f59e0b;
      --accent-spam-bg: #fffbeb;
      --accent-spam-border: #fde68a;
      --accent-spam-text: #92400e;

      --accent-borderline: #8b5cf6;
      --accent-borderline-bg: #f5f3ff;
      --accent-borderline-border: #ddd6fe;
      --accent-borderline-text: #5b21b6;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 80px;
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-model {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: #e0e7ff;
      color: #3730a3;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .main-container {
      max-width: 1280px;
      margin: 28px auto;
      padding: 0 24px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .stat-card.total::before { background: #64748b; }
    .stat-card.acceptable::before { background: var(--accent-acceptable); }
    .stat-card.toxic::before { background: var(--accent-toxic); }
    .stat-card.spam::before { background: var(--accent-spam); }
    .stat-card.borderline::before { background: var(--accent-borderline); }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.85rem;
      font-weight: 800;
      margin-top: 4px;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .stat-percent {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Distribution Progress Bar */
    .distribution-bar-wrapper {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .distribution-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .bar-container {
      height: 12px;
      width: 100%;
      background: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
    }

    .bar-segment {
      height: 100%;
      transition: width 0.3s ease;
    }
    .bar-segment.acceptable { background: var(--accent-acceptable); }
    .bar-segment.toxic { background: var(--accent-toxic); }
    .bar-segment.spam { background: var(--accent-spam); }

    /* Controls Bar */
    .controls-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab-btn {
      background: var(--bg-canvas);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      background: var(--border-color);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--text-main);
      color: var(--bg-surface);
      border-color: var(--text-main);
    }

    .tab-btn .tab-count {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(125, 125, 125, 0.15);
    }

    .search-sort-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
      min-width: 280px;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 14px 8px 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      pointer-events: none;
    }

    .sort-select {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      font-size: 0.875rem;
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    /* Comments Cards Grid */
    .comments-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .comment-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .comment-card:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-md);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      background: var(--border-color);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
    }

    .author-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .thread-tag {
      font-size: 0.75rem;
      background: var(--bg-canvas);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .meta-details {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .id-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      background: var(--bg-canvas);
      border: 1px solid var(--border-color);
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .comment-text {
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border-left: 3px solid #cbd5e1;
    }

    .card-bottom {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .prediction-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .decision-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .decision-pill.acceptable {
      background: var(--accent-acceptable-bg);
      color: var(--accent-acceptable-text);
      border: 1px solid var(--accent-acceptable-border);
    }

    .decision-pill.toxic {
      background: var(--accent-toxic-bg);
      color: var(--accent-toxic-text);
      border: 1px solid var(--accent-toxic-border);
    }

    .decision-pill.spam {
      background: var(--accent-spam-bg);
      color: var(--accent-spam-text);
      border: 1px solid var(--accent-spam-border);
    }

    .confidence-tag {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .borderline-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-borderline-bg);
      color: var(--accent-borderline-text);
      border: 1px solid var(--accent-borderline-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .probs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .bar-mini-wrapper {
      width: 70px;
      height: 6px;
      background: var(--border-color);
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-mistake {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-mistake:hover {
      background: var(--bg-canvas);
      border-color: var(--text-muted);
      color: var(--text-main);
    }

    .copied-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
    }

    .copied-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand-title">
        <h1>
          Forum Comment Moderation
          <span class="badge-model">Cloudflare clef</span>
        </h1>
      </div>
      <div>
        <span class="id-badge">Total: 100 items</span>
      </div>
    </div>
  </header>

  <main class="main-container">

    <!-- KPI Summary Cards -->
    <section class="stats-grid">
      <div class="stat-card total">
        <span class="stat-label">Total Comments</span>
        <div class="stat-value">100</div>
      </div>
      <div class="stat-card acceptable">
        <span class="stat-label">Acceptable</span>
        <div class="stat-value">
          72
          <span class="stat-percent">(72.0%)</span>
        </div>
      </div>
      <div class="stat-card toxic">
        <span class="stat-label">Toxic</span>
        <div class="stat-value">
          14
          <span class="stat-percent">(14.0%)</span>
        </div>
      </div>
      <div class="stat-card spam">
        <span class="stat-label">Spam</span>
        <div class="stat-value">
          14
          <span class="stat-percent">(14.0%)</span>
        </div>
      </div>
      <div class="stat-card borderline">
        <span class="stat-label">Borderline / Low Conf</span>
        <div class="stat-value">
          4
          <span class="stat-percent">(4.0%)</span>
        </div>
      </div>
    </section>

    <!-- Visual Distribution Bar -->
    <div class="distribution-bar-wrapper">
      <div class="distribution-title">
        <span>Moderation Distribution</span>
        <span>72 Acceptable / 14 Toxic / 14 Spam</span>
      </div>
      <div class="bar-container">
        <div class="bar-segment acceptable" style="width: 72.00%" title="Acceptable: 72"></div>
        <div class="bar-segment toxic" style="width: 14.00%" title="Toxic: 14"></div>
        <div class="bar-segment spam" style="width: 14.00%" title="Spam: 14"></div>
      </div>
    </div>

    <!-- Controls & Filter Toolbar -->
    <section class="controls-panel">
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">All <span class="tab-count">100</span></button>
        <button class="tab-btn" data-filter="acceptable">Acceptable <span class="tab-count">72</span></button>
        <button class="tab-btn" data-filter="toxic">Toxic <span class="tab-count">14</span></button>
        <button class="tab-btn" data-filter="spam">Spam <span class="tab-count">14</span></button>
        <button class="tab-btn" data-filter="borderline">&#9873; Borderline <span class="tab-count">4</span></button>
      </div>

      <div class="search-sort-group">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search comments, author, ID...">
        </div>

        <select id="sortSelect" class="sort-select">
          <option value="id-asc">Sort: ID (1 &rarr; 100)</option>
          <option value="id-desc">Sort: ID (100 &rarr; 1)</option>
          <option value="conf-asc">Sort: Lowest Confidence First</option>
          <option value="conf-desc">Sort: Highest Confidence First</option>
        </select>
      </div>
    </section>

    <!-- Comments Container -->
    <div id="commentsContainer" class="comments-grid">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <div id="toast" class="copied-toast">Template copied for MISTAKES.md!</div>

  <script>

on": {"choice": "acceptable", "confidence": 0.811, "probabilities": {"acceptable": 0.9336, "toxic": 0.0398, "spam": 0.0266}}}, {"id": 99, "author": "Raju Startup", "thread": "General", "posted_at": "2026-10-23 12:00", "comment": "Hey guys check out my startup app, we are giving \u20b9100 Paytm cash for every signup using my referral code RAJU100 \ud83d\ude0a Link: refer-n-earn.app/RAJU100", "classification": {"choice": "spam", "confidence": 0.9029, "probabilities": {"acceptable": 0.0245, "toxic": 0.0088, "spam": 0.9667}}}, {"id": 100, "author": "Shreya Patil", "thread": "General", "posted_at": "2026-10-25 10:40", "comment": "Ma'am, any update on when the next assignment will be released? Want to plan around mid-sems.", "classification": {"choice": "acceptable", "confidence": 0.8435, "probabilities": {"acceptable": 0.9456, "toxic": 0.0307, "spam": 0.0237}}}];

    let activeFilter = 'all';
    let searchQuery = '';
    let activeSort = 'id-asc';

    const container = document.getElementById('commentsContainer');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const tabButtons = document.querySelectorAll('.tab-btn');
    const toast = document.getElementById('toast');

    function isBorderline(item) {
      const c = item.classification;
      if (c.confidence < 0.55) return true;
      const probs = Object.values(c.probabilities || {}).sort((a, b) => b - a);
      if (probs.length > 1 && (probs[0] - probs[1]) < 0.25) return true;
      return false;
    }

    function copyMistakeTemplate(id, choice, text) {
      const cleaned = (text || '').replace(/"/g, '').slice(0, 100);
      const snippet = [
        "- **Comment #" + id + "**:",
        "  - Clef's label: `" + choice + "` | Correct label: `[ENTER_LABEL]`",
        "  - Reason: [1-2 sentences explaining why]",
        '  - Excerpt: "' + cleaned + '..."'
      ].join('\n') + '\n';
      navigator.clipboard.writeText(snippet).then(() => {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }

    function render() {
      let filtered = commentsData.filter(item => {
        if (activeFilter === 'borderline') {
          if (!isBorderline(item)) return false;
        } else if (activeFilter !== 'all') {
          if (item.classification.choice !== activeFilter) return false;
        }

        if (searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase();
          const matchText = (item.comment || '').toLowerCase().includes(q);
          const matchAuthor = (item.author || '').toLowerCase().includes(q);
          const matchThread = (item.thread || '').toLowerCase().includes(q);
          const matchId = String(item.id).includes(q);
          return matchText || matchAuthor || matchThread || matchId;
        }

        return true;
      });

      filtered.sort((a, b) => {
        if (activeSort === 'id-asc') return a.id - b.id;
        if (activeSort === 'id-desc') return b.id - a.id;
        if (activeSort === 'conf-asc') return a.classification.confidence - b.classification.confidence;
        if (activeSort === 'conf-desc') return b.classification.confidence - a.classification.confidence;
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No comments match your filter</h3>
            <p>Try selecting a different filter tab or clearing the search query.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const c = item.classification;
        const choice = c.choice || 'unknown';
        const confPercent = Math.round((c.confidence || 0) * 100);
        const borderline = isBorderline(item);

        const initials = (item.author || 'User')
          .split(' ')
          .map(p => p[0])
          .slice(0, 2)
          .join('');

        const probs = c.probabilities || {};
        const pAcc = Math.round((probs.acceptable || 0) * 100);
        const pTox = Math.round((probs.toxic || 0) * 100);
        const pSpam = Math.round((probs.spam || 0) * 100);

        return `
          <article class="comment-card" id="card-${item.id}">
            <div class="card-top">
              <div class="author-info">
                <div class="avatar">${initials}</div>
                <div>
                  <div class="author-name">${escapeHtml(item.author)}</div>
                  <div class="thread-tag">${escapeHtml(item.thread)}</div>
                </div>
              </div>
              <div class="meta-details">
                <span>${escapeHtml(item.posted_at)}</span>
                <span class="id-badge">ID #${item.id}</span>
              </div>
            </div>

            <div class="comment-text">${escapeHtml(item.comment)}</div>

            <div class="card-bottom">
              <div class="prediction-group">
                <span class="decision-pill ${choice}">
                  ${choice}
                </span>
                <span class="confidence-tag">
                  Confidence: <strong>${confPercent}%</strong>
                </span>
                ${borderline ? '<span class="borderline-indicator">&#9873; Borderline</span>' : ''}
                <div class="probs-bar" title="Acceptable: ${pAcc}% | Toxic: ${pTox}% | Spam: ${pSpam}%">
                  <div class="bar-mini-wrapper">
                    <div style="width: ${pAcc}%; background: var(--accent-acceptable);"></div>
                    <div style="width: ${pTox}%; background: var(--accent-toxic);"></div>
                    <div style="width: ${pSpam}%; background: var(--accent-spam);"></div>
                  </div>
                  <span>A:${pAcc}% T:${pTox}% S:${pSpam}%</span>
                </div>
              </div>

              <div class="actions-group">
                <button class="btn-mistake" onclick="copyMistakeTemplate(${item.id}, '${choice}', '${escapeAttr(item.comment)}')">
                  📋 Copy for MISTAKES.md
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str)
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/\n/g, ' ');
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    sortSelect.addEventListener('change', (e) => {
      activeSort = e.target.value;
      render();
    });

    render();
  </script>
